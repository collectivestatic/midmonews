
name: Update RSS feed

on:
  schedule:
    # 11:00 UTC = ~6am Central time (adjust to taste). Runs once a day.
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually on GitHub

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build feed
        run: python3 scripts/build_feed.py

      - name: Commit updated feed + cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json docs/feed.xml
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update feed $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
